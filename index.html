<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cbf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Pilates Enroll</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Pilates Enroll</h1><p id="clock"></p></header>
<main>
  <section id="list"></section>
  <p id="empty" hidden>No enrollments yet. Tap + to schedule one.</p>
</main>
<button id="add" aria-label="Add enrollment">+</button>

<dialog id="form-dlg">
  <form id="form" method="dialog">
    <h2>New enrollment</h2>
    <label>Class name<input name="name" required placeholder="Reformer – Beginner"></label>
    <label>Class date &amp; time<input name="classAt" type="datetime-local" required></label>
    <label>Enroll automatically at<input name="enrollAt" type="datetime-local" required></label>
    <div class="row">
      <button type="button" id="cancel" class="ghost">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script src="connector.js"></script>
<script src="app.js"></script>
</body>
</html>
